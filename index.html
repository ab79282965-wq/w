
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

  <title>موقعي الأول</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #101827, #253b63);
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .card {

    p { line-height: 1.9; }
    a {
      display: inline-block;
      padding: 12px 22px;
      background: #38bdf8;
      color: #102033;
      text-decoration: none;
      border-radius: 12px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>أهلًا بك في موقعي الأول! 🚀</h1>
    <p>هذا أول موقع أصممه وأنشره على الإنترنت.</p>

</html>
